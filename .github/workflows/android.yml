name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub web interface

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Sync Sources to Chaquopy Asset Folder
      run: |
        mkdir -p android/app/src/main/python
        cp server.py android/app/src/main/python/server.py
        cp -r public android/app/src/main/python/public

    - name: Build with Gradle
      run: |
        # Generate Gradle 8.2 wrapper in a temp directory to bypass Gradle 9.x configuration errors
        mkdir temp_gradle
        cd temp_gradle
        gradle wrapper --gradle-version 8.2
        cp -r gradlew gradlew.bat gradle ../
        cd ..
        rm -rf temp_gradle
        
        # Build using the correct Gradle 8.2 wrapper
        chmod +x gradlew
        ./gradlew assembleDebug
      working-directory: android

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: AetherPlayer-Android-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
